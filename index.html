<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101329">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game App">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Game App</title>
  <style>
    :root{--bg:#0b0d1a;--card:#14172a;--card2:#1b1f38;--text:#f7f7fb;--muted:#9da4c4;--accent:#8b5cf6;--accent2:#22d3ee;--line:#292e4d}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0d1a,#101329 60%,#0b0d1a);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;min-height:100vh}
    button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{max-width:700px;margin:auto;padding-bottom:92px}
    header{padding:22px 18px 12px;position:sticky;top:0;z-index:5;background:rgba(11,13,26,.88);backdrop-filter:blur(18px)}
    .top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:900;letter-spacing:-.8px}.logo span{color:var(--accent2)}
    .avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900}
    main{padding:8px 18px}.hero{padding:20px 0}.hero h1{font-size:34px;line-height:1.05;margin:0 0 9px}.hero p{color:var(--muted);margin:0;line-height:1.5}
    .search{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;color:var(--text);width:100%;outline:none}
    .chips{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}.chip{background:var(--card);border:1px solid var(--line);padding:9px 13px;border-radius:999px;white-space:nowrap;color:var(--muted)}.chip.active{background:var(--accent);color:#fff;border-color:transparent}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.game{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}.cover{height:135px;display:flex;align-items:end;padding:13px;background:linear-gradient(135deg,#30246b,#10152d)}.cover.c2{background:linear-gradient(135deg,#075985,#111827)}.cover.c3{background:linear-gradient(135deg,#7c2d12,#111827)}.cover.c4{background:linear-gradient(135deg,#14532d,#111827)}.cover.c5{background:linear-gradient(135deg,#831843,#111827)}.cover.c6{background:linear-gradient(135deg,#164e63,#111827)}
    .cover b{font-size:18px;text-shadow:0 2px 10px #000}.heart{position:absolute;right:9px;top:9px;width:34px;height:34px;border-radius:12px;background:rgba(0,0,0,.35);font-size:17px}.heart.on{color:#f472b6}
    .info{padding:12px}.meta{font-size:12px;color:var(--muted);margin:4px 0 10px}.play{width:100%;padding:10px;border-radius:12px;background:var(--card2);font-weight:700}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-title h2{margin:0;font-size:20px}.section-title small{color:var(--accent2)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.xpbar{height:9px;background:#282d48;border-radius:99px;overflow:hidden;margin:10px 0}.xpbar i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}.num{width:28px;text-align:center;color:var(--muted);font-weight:800}.mini{width:40px;height:40px;border-radius:13px;background:var(--card2);display:grid;place-items:center}.rank .grow{flex:1}.points{font-weight:800;color:var(--accent2)}
    nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(15,18,38,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
    .navin{width:min(700px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.navbtn{background:transparent;padding:7px 3px;border-radius:13px;color:var(--muted);font-size:11px}.navbtn.active{color:#fff;background:var(--card2)}.navbtn strong{display:block;font-size:19px;margin-bottom:2px}
    .empty{text-align:center;color:var(--muted);padding:35px 15px}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(15px);opacity:0;background:#fff;color:#111;padding:11px 16px;border-radius:13px;font-weight:700;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="logo">GAME <span>APP</span></div><div class="avatar">GA</div></div></header>
<main id="main"></main>
</div>
<nav><div class="navin">
<button class="navbtn active" data-page="home"><strong>⌂</strong>Accueil</button>
<button class="navbtn" data-page="games"><strong>🎮</strong>Jeux</button>
<button class="navbtn" data-page="rank"><strong>🏆</strong>Classement</button>
<button class="navbtn" data-page="profile"><strong>👤</strong>Profil</button>
</div></nav>
<div id="toast" class="toast"></div>
<script>
const games=[
{id:1,n:"Shadow Arena",cat:"Action",xp:420,c:"",icon:"⚔️"},
{id:2,n:"Neon Rush",cat:"Arcade",xp:360,c:"c2",icon:"🏎️"},
{id:3,n:"Ocean Quest",cat:"Aventure",xp:315,c:"c3",icon:"🌊"},
{id:4,n:"Golden Kingdom",cat:"RPG",xp:290,c:"c4",icon:"👑"},
{id:5,n:"Cyber Strike",cat:"Action",xp:255,c:"c5",icon:"🤖"},
{id:6,n:"Galaxy Legends",cat:"Arcade",xp:230,c:"c6",icon:"🚀"}
];
let fav=JSON.parse(localStorage.getItem("gameapp_fav")||"[]"), page="home", query="", filter="Tous";
const ranks=[["Nova","2 480"],["PixelFox","2 210"],["Luna","1 960"],["GameMaster","1 740"],["Kiro","1 520"]];
function save(){localStorage.setItem("gameapp_fav",JSON.stringify(fav))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function card(g){let on=fav.includes(g.id);return `<article class="game"><button class="heart ${on?'on':''}" onclick="toggleFav(${g.id})">${on?'♥':'♡'}</button><div class="cover ${g.c}"><b>${g.icon} ${g.n}</b></div><div class="info"><b>${g.n}</b><div class="meta">${g.cat} · ${g.xp} XP</div><button class="play" onclick="toast('Ouverture de ${g.n}…')">Jouer</button></div></article>`}
function gamesView(list=games){return `<div class="hero"><h1>Découvre ton prochain jeu.</h1><p>Explore, joue, gagne de l’XP et construis ton profil de gamer.</p><input class="search" placeholder="🔎 Rechercher un jeu…" value="${query}" oninput="query=this.value;render()"><div class="chips">${["Tous","Action","Arcade","Aventure","RPG"].map(x=>`<button class="chip ${filter==x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join("")}</div><div class="grid">${list.length?list.map(card).join(""):'<div class="empty" style="grid-column:1/-1">Aucun jeu trouvé.</div>'}</div></div>`}
function render(){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let main=document.getElementById("main");
if(page==="home"){let list=games.filter(g=>(filter==="Tous"||g.cat===filter)&&g.n.toLowerCase().includes(query.toLowerCase()));main.innerHTML=`${gamesView(list)}<div class="section-title"><h2>Ta progression</h2><small>Niveau 12</small></div><div class="panel"><b>1 240 / 2 000 XP</b><div class="xpbar"><i></i></div><span class="meta">760 XP avant le prochain niveau</span></div>`}
if(page==="games"){let list=games.filter(g=>(filter==="Tous"||g.cat===filter)&&g.n.toLowerCase().includes(query.toLowerCase()));main.innerHTML=`<div class="section-title"><h2>Tous les jeux</h2></div>${gamesView(list)}`}
if(page==="rank"){main.innerHTML=`<div class="hero"><h1>Classement 🏆</h1><p>Compare ta progression avec la communauté.</p></div><div class="panel">${ranks.map((r,i)=>`<div class="rank"><div class="num">#${i+1}</div><div class="mini">${["🦊","👾","🌙","🎮","⚡"][i]}</div><div class="grow"><b>${r[0]}</b><div class="meta">Niveau ${12-i}</div></div><div class="points">${r[1]} XP</div></div>`).join("")}</div>`}
if(page==="profile"){main.innerHTML=`<div class="hero"><h1>Ton profil 👤</h1><p>Gère ta progression et tes favoris.</p></div><div class="panel"><div style="display:flex;align-items:center;gap:14px"><div class="avatar" style="width:58px;height:58px">GA</div><div><h2 style="margin:0">Gamer</h2><div class="meta">Niveau 12 · 1 240 XP</div></div></div><div class="xpbar"><i></i></div></div><div class="section-title"><h2>Mes favoris</h2><small>${fav.length} jeu${fav.length>1?'x':''}</small></div><div class="grid">${fav.length?games.filter(g=>fav.includes(g.id)).map(card).join(""):'<div class="empty" style="grid-column:1/-1">Ajoute des jeux à tes favoris avec ♡</div>'}</div><div class="section-title"><h2>Réussites</h2></div><div class="panel">🎯 Premier pas · 🎮 5 jeux découverts · ⭐ 3 favoris</div>`}
}
function toggleFav(id){if(fav.includes(id))fav=fav.filter(x=>x!==id);else fav.push(id);save();toast(fav.includes(id)?"Ajouté aux favoris":"Retiré des favoris");render()}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{page=b.dataset.page;query="";filter="Tous";render()});
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body></html>
